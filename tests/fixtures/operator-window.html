<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Carbonyl operator-window input test</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; }
  body { background: #003366; color: white; font: 12px sans-serif; }
  button { width: 120px; height: 40px; margin: 4px; background: #aa0000;
           color: white; border: 0; font: inherit; }
  input { display: block; width: 140px; height: 28px; margin: 4px;
          font: inherit; }
  #typography-marker { margin: 4px; color: #00ff77; font: 48px/1 sans-serif; }
  #resize-marker { position: fixed; right: 8px; bottom: 8px; width: 48px;
                   height: 48px; background: #111111; }
  #pointer-marker { position: fixed; left: 8px; bottom: 8px; width: 48px;
                    height: 48px; background: #cc44cc; }
  #focus-marker { position: fixed; left: calc(50% - 24px); bottom: 8px;
                  width: 48px; height: 48px; background: #333333; }
</style>
</head>
<body>
  <button id="target">CLICK_OPERATOR_TARGET</button>
  <input id="keyboard" aria-label="Operator keyboard target">
  <div id="typography-marker">FONT_SCALE_48PX</div>
  <div id="resize-marker" aria-hidden="true"></div>
  <div id="pointer-marker" aria-hidden="true"></div>
  <div id="focus-marker" aria-hidden="true"></div>
  <script>
    const target = document.querySelector('#target');
    const keyboard = document.querySelector('#keyboard');
    const resizeMarker = document.querySelector('#resize-marker');
    const pointerMarker = document.querySelector('#pointer-marker');
    const focusMarker = document.querySelector('#focus-marker');
    const initialSize = [innerWidth, innerHeight];
    target.addEventListener('click', event => {
      if (!event.isTrusted) return;
      target.style.background = '#00aa44';
      keyboard.focus();
    });
    keyboard.addEventListener('keydown', event => {
      if (!event.isTrusted) return;
      document.body.style.background = '#665500';
    });
    keyboard.addEventListener('input', event => {
      if (!event.isTrusted) return;
      if (keyboard.value.endsWith('focus-recovered')) {
        focusMarker.style.background = '#7722aa';
      }
    });
    addEventListener('resize', event => {
      if (!event.isTrusted) return;
      if (Math.abs(innerWidth - initialSize[0]) >= 100 ||
          Math.abs(innerHeight - initialSize[1]) >= 100) {
        resizeMarker.style.background = '#aa00aa';
        // The marker proves the native surface resized, but it sits outside
        // the small top-left viewport emitted by the terminal test. Change
        // the page background too so the same trusted resize has an
        // observable terminal-side effect.
        document.body.style.background = '#440066';
      }
    });
    addEventListener('contextmenu', event => {
      if (!event.isTrusted) return;
      event.preventDefault();
      pointerMarker.style.background = '#00aaaa';
    });
    addEventListener('wheel', event => {
      if (!event.isTrusted) return;
      pointerMarker.style.background = '#aa5500';
    }, {passive: true});
  </script>
</body>
</html>
